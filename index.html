<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localisateur de Lot Agricole</title>
    <!-- Tailwind CSS pour un design propre et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Turf.js pour calculer le centroïde du polygone GeoJSON -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Localisateur de Lot (Québec)</h1>
        
        <form id="lotForm" class="space-y-4">
            <div>
                <label for="lotNumber" class="block text-sm font-medium text-gray-700">Numéro de lot (7 chiffres)</label>
                <input type="text" id="lotNumber" placeholder="Ex: 4128182" maxlength="10" 
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 text-lg">
            </div>
            
            <button type="submit" 
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none font-medium text-lg transition-colors">
                Trouver les coordonnées
            </button>
        </form>

        <!-- Zone de résultat -->
        <div id="result" class="mt-8 hidden">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-md">
                <p class="text-sm text-gray-500 font-semibold mb-1">Lot trouvé : <span id="resLotName" class="text-gray-800"></span></p>
                
                <div class="mt-3 space-y-2">
                    <p class="text-gray-700"><strong>Latitude :</strong> <span id="resLat" class="font-mono bg-white px-2 py-1 rounded"></span></p>
                    <p class="text-gray-700"><strong>Longitude :</strong> <span id="resLng" class="font-mono bg-white px-2 py-1 rounded"></span></p>
                </div>
                
                <a id="mapsLink" href="#" target="_blank" rel="noopener noreferrer" 
                   class="mt-4 inline-flex items-center text-blue-600 hover:text-blue-800 font-medium">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Ouvrir dans Google Maps
                </a>
            </div>
        </div>

        <!-- Zone d'erreur -->
        <div id="error" class="mt-6 hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-r-md">
            <p id="errorText" class="text-sm text-red-700"></p>
        </div>
    </div>

    <script>
        document.getElementById('lotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');
            const btn = e.target.querySelector('button');
            
            // Réinitialisation de l'affichage
            resultDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            btn.textContent = "Recherche en cours...";
            btn.disabled = true;

            try {
                // 1. Nettoyage et formatage du lot (ex: "4128182" -> "4 128 182")
                const rawLot = document.getElementById('lotNumber').value.replace(/\s/g, '');
                if (rawLot.length !== 7 || isNaN(rawLot)) {
                    throw new Error("Le numéro de lot doit contenir exactement 7 chiffres.");
                }
                const formattedLot = `${rawLot.charAt(0)} ${rawLot.substring(1, 4)} ${rawLot.substring(4, 7)}`;

                // 2. Requête API
                const baseUrl = 'https://geo.environnement.gouv.qc.ca/donnees/rest/services/Reference/Cadastre_allege/MapServer/0/query';
                const params = new URLSearchParams({
                    where: `NO_LOT='${formattedLot}'`,
                    outFields: 'NO_LOT',
                    outSR: '4326',
                    f: 'geojson'
                });

                const response = await fetch(`${baseUrl}?${params.toString()}`);
                if (!response.ok) throw new Error("Le serveur du gouvernement est inaccessible.");
                
                const data = await response.json();

                if (!data.features || data.features.length === 0) {
                    throw new Error(`Le lot ${formattedLot} est introuvable. Vérifiez le numéro.`);
                }

                // 3. Calcul du centroïde avec Turf.js
                const feature = data.features[0];
                const centroid = turf.centroid(feature);
                
                // Turf retourne [longitude, latitude]
                const lng = centroid.geometry.coordinates[0];
                const lat = centroid.geometry.coordinates[1];

                // 4. Affichage des résultats
                document.getElementById('resLotName').textContent = feature.properties.NO_LOT;
                document.getElementById('resLat').textContent = lat.toFixed(6);
                document.getElementById('resLng').textContent = lng.toFixed(6);
                
                // Lien Google Maps (vue satellite par défaut pour le milieu agricole)
                document.getElementById('mapsLink').href = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                
                resultDiv.classList.remove('hidden');

            } catch (err) {
                document.getElementById('errorText').textContent = err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                btn.textContent = "Trouver les coordonnées";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
